<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Saya - Warteg Pak Sanam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/db-service.js"></script>
    <script defer src="../assets/js/admin-app.js"></script>
    <style>
        .profil-header-card { display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: 12px; background: #ffffff; border: 1px solid var(--c-garis); margin-bottom: 20px; flex-wrap: wrap; }
        .profil-avatar-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--c-oranye-tua); }
    </style>
</head>
<body>
<div class="main-content">
    <div id="notifProfil" style="margin-bottom:14px;"></div>

    <div class="profil-header-card">
        <img id="avatarBesar" src="../uploads/admin/006a36b5a411db9a6784.jpg" alt="Foto Profil" class="profil-avatar-lg" onerror="this.onerror=null;this.src='../uploads/1.jpeg';">
        <div>
            <h2 id="profilNamaJudul" style="margin:0 0 4px;">Admin Warteg</h2>
            <p class="teks-redup" style="margin:0;"><span id="profilUsername">@admin</span> · <span id="profilRole" class="badge badge-abu">OWNER</span></p>
        </div>
    </div>

    <!-- 1. Informasi Pribadi & Foto Profil -->
    <div class="accordion-item">
        <button type="button" class="accordion-header" aria-expanded="true" aria-controls="accPribadi" onclick="toggleAcc('accPribadi', this)">
            <span>Informasi Pribadi &amp; Foto</span>
            <svg class="accordion-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="accordion-body" id="accPribadi">
            <form id="formPribadi">
                <label class="form-label" for="inpNama">Nama lengkap</label>
                <input class="form-control" id="inpNama" required maxlength="100">

                <label class="form-label" for="inpFoto" style="margin-top:10px;">Ganti Foto Profil</label>
                <input class="form-control" type="file" id="inpFoto" accept="image/*">
                <p class="bantuan">Pilih file gambar JPG, PNG, atau WebP.</p>

                <button class="btn btn-primary" type="submit" style="margin-top:14px;">Simpan Informasi Pribadi</button>
            </form>
        </div>
    </div>

    <!-- 2. Kontak & Alamat -->
    <div class="accordion-item">
        <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accKontak" onclick="toggleAcc('accKontak', this)">
            <span>Kontak &amp; Alamat</span>
            <svg class="accordion-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="accordion-body" id="accKontak" style="display:none;">
            <form id="formKontak">
                <label class="form-label" for="inpEmail">Email</label>
                <input class="form-control" id="inpEmail" type="email">

                <label class="form-label" for="inpTelepon" style="margin-top:10px;">Nomor Telepon / WhatsApp</label>
                <input class="form-control" id="inpTelepon">

                <label class="form-label" for="inpAlamat" style="margin-top:10px;">Alamat Domisili</label>
                <textarea class="form-control" id="inpAlamat" rows="2"></textarea>

                <button class="btn btn-primary" type="submit" style="margin-top:14px;">Simpan Kontak</button>
            </form>
        </div>
    </div>

    <!-- 3. Ubah Kata Sandi -->
    <div class="accordion-item">
        <button type="button" class="accordion-header" aria-expanded="false" aria-controls="accPassword" onclick="toggleAcc('accPassword', this)">
            <span>Ubah Kata Sandi</span>
            <svg class="accordion-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="accordion-body" id="accPassword" style="display:none;">
            <form id="formPassword">
                <label class="form-label" for="passLama">Kata Sandi Saat Ini</label>
                <input class="form-control" id="passLama" type="password" required autocomplete="current-password">

                <label class="form-label" for="passBaru" style="margin-top:10px;">Kata Sandi Baru</label>
                <input class="form-control" id="passBaru" type="password" required minlength="6" autocomplete="new-password">

                <label class="form-label" for="passKonfirm" style="margin-top:10px;">Ulangi Kata Sandi Baru</label>
                <input class="form-control" id="passKonfirm" type="password" required minlength="6" autocomplete="new-password">

                <button class="btn btn-primary" type="submit" style="margin-top:14px;">Perbarui Kata Sandi</button>
            </form>
        </div>
    </div>
</div>

<script>
function toggleAcc(id, btn) {
    var el = document.getElementById(id);
    var buka = (el.style.display === 'none');
    el.style.display = buka ? 'block' : 'none';
    if (btn) btn.setAttribute('aria-expanded', buka ? 'true' : 'false');
}

document.addEventListener('DOMContentLoaded', function () {
    var DB = window.WARTEG_DB;
    window.WARTEG_ADMIN_LAYOUT.render('', 'Profil Saya');

    var sesi = DB.getAdminSesi();
    if (!sesi) return;

    document.getElementById('profilNamaJudul').textContent = sesi.nama || 'Admin Warteg';
    document.getElementById('profilUsername').textContent = '@' + (sesi.username || 'admin');
    document.getElementById('profilRole').textContent = (sesi.role || 'admin').toUpperCase();
    document.getElementById('inpNama').value = sesi.nama || '';
    document.getElementById('inpEmail').value = sesi.email || '';
    document.getElementById('inpTelepon').value = sesi.no_hp || '';
    document.getElementById('inpAlamat').value = sesi.jabatan || '';

    if (sesi.foto) {
        document.getElementById('avatarBesar').src = sesi.foto.startsWith('data:') ? sesi.foto : ('../uploads/admin/' + sesi.foto);
    }

    function notif(msg, tipe) {
        var w = document.getElementById('notifProfil');
        w.innerHTML = '<div class="alert alert-' + (tipe || 'sukses') + '">' + DB.escapeHtml(msg) + '</div>';
        setTimeout(function () { w.innerHTML = ''; }, 4000);
    }

    document.getElementById('formPribadi').onsubmit = function (e) {
        e.preventDefault();
        var namaBaru = document.getElementById('inpNama').value.trim();
        var fileInp = document.getElementById('inpFoto');
        var f = fileInp.files && fileInp.files[0];

        async function simpan(fotoUrl) {
            try {
                var res = await DB.updateProfilAdmin({
                    nama: namaBaru,
                    foto: fotoUrl !== undefined ? fotoUrl : sesi.foto
                });
                if (!res || !res.ok) {
                    notif((res && res.pesan) || 'Gagal memperbarui profil.', 'galat');
                    return;
                }
                sesi = res.admin;
                document.getElementById('profilNamaJudul').textContent = sesi.nama;
                notif('Informasi pribadi berhasil disimpan.', 'sukses');
            } catch (err) {
                notif('Gangguan koneksi saat memperbarui profil.', 'galat');
            }
        }

        if (f) {
            var reader = new FileReader();
            reader.onload = function (evt) {
                var dUrl = evt.target.result;
                document.getElementById('avatarBesar').src = dUrl;
                simpan(dUrl);
            };
            reader.readAsDataURL(f);
        } else {
            simpan();
        }
    };

    document.getElementById('formKontak').onsubmit = async function (e) {
        e.preventDefault();
        try {
            var res = await DB.updateProfilAdmin({
                email: document.getElementById('inpEmail').value.trim(),
                no_hp: document.getElementById('inpTelepon').value.trim(),
                jabatan: document.getElementById('inpAlamat').value.trim()
            });
            if (!res || !res.ok) {
                notif((res && res.pesan) || 'Gagal menyimpan kontak.', 'galat');
                return;
            }
            sesi = res.admin;
            notif('Kontak & jabatan berhasil disimpan.', 'sukses');
        } catch (err) {
            notif('Gangguan koneksi saat menyimpan kontak.', 'galat');
        }
    };

    document.getElementById('formPassword').onsubmit = async function (e) {
        e.preventDefault();
        var lama = document.getElementById('passLama').value;
        var baru = document.getElementById('passBaru').value;
        var konf = document.getElementById('passKonfirm').value;

        if (baru !== konf) {
            notif('Konfirmasi kata sandi baru tidak cocok.', 'galat');
            return;
        }

        try {
            var res = await DB.ubahPasswordAdmin(lama, baru);
            if (!res || !res.ok) {
                notif((res && res.pesan) || 'Kata sandi saat ini tidak sesuai.', 'galat');
                return;
            }
            notif('Kata sandi berhasil diperbarui.', 'sukses');
            document.getElementById('formPassword').reset();
        } catch (err) {
            notif('Gangguan koneksi saat memperbarui kata sandi.', 'galat');
        }
    };
});
</script>
</body>
</html>
