<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Pemesan - Warteg Pak Sanam</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/db-service.js"></script>
    <script src="../assets/js/admin-app.js"></script>
</head>
<body>
<div class="main-content">
    <div class="content-card">
        <form class="filter-bar" id="formFilter">
            <input class="form-control" type="search" id="filQ" placeholder="Cari kode pesanan atau nama pelanggan">
            <input class="form-control" type="date" id="filTgl" title="Tanggal pengambilan">
            <select class="form-select" id="filStatus">
                <option value="">Semua status</option>
                <option value="Menunggu Konfirmasi">Menunggu Konfirmasi</option>
                <option value="Sedang Dimasak">Sedang Dimasak</option>
                <option value="Siap Diambil">Siap Diambil</option>
            </select>
            <button class="btn btn-primary" type="submit">Terapkan</button>
            <button class="btn btn-secondary" type="button" id="btnReset">Reset</button>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:50px;">No</th>
                        <th>Kode</th>
                        <th>Pelanggan</th>
                        <th>Tanggal Ambil</th>
                        <th>Jam</th>
                        <th>Pembayaran</th>
                        <th>Status</th>
                        <th class="kolom-aksi" style="text-align:center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbodyPemesan">
                    <tr><td colspan="8" class="kosong">Memuat data pesanan...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="paginasiWrap" style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
            <span class="teks-redup" id="teksInfoPaginasi">-</span>
            <div>
                <button type="button" class="btn btn-secondary btn-kecil" id="btnHalPrev">Sebelumnya</button>
                <button type="button" class="btn btn-secondary btn-kecil" id="btnHalNext">Berikutnya</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Detail Pesanan -->
<div class="modal" id="modalDetail" hidden style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;">
    <div class="modal-kotak" role="dialog" aria-modal="true" style="background:#fff;border-radius:12px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 36px rgba(0,0,0,0.22);">
        <div class="modal-kepala" style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e7eb;">
            <div style="display:flex;align-items:center;gap:10px;">
                <h2 id="modalJudul" style="font-size:17px;margin:0;font-weight:700;">Detail Pesanan</h2>
            </div>
            <button type="button" class="btn-tutup" id="modalTutup" aria-label="Tutup Detail" style="background:none;border:none;font-size:24px;cursor:pointer;line-height:1;">&times;</button>
        </div>
        <div class="modal-isi" id="modalIsi" style="padding:20px;"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    window.WARTEG_ADMIN_LAYOUT.render('pemesan', 'Daftar Pemesan');

    var curHal = 1;

    // Baca query param jika diarahkan dari halaman rekap
    var urlParams = new URLSearchParams(window.location.search);
    var qAwal = urlParams.get('q');
    if (qAwal) {
        document.getElementById('filQ').value = qAwal;
    }

    async function muatDaftar() {
        var q = document.getElementById('filQ').value.trim();
        var tgl = document.getElementById('filTgl').value;
        var st = document.getElementById('filStatus').value;

        var res = await window.WARTEG_DB.getDaftarPemesan({ q: q, tanggal: tgl, status: st, hal: curHal, per: 10 });
        var tbody = document.getElementById('tbodyPemesan');
        tbody.innerHTML = '';

        if (!res.items || !res.items.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="kosong">Tidak ada pesanan yang cocok dengan filter.</td></tr>';
            document.getElementById('teksInfoPaginasi').textContent = '0 pesanan';
            return;
        }

        document.getElementById('teksInfoPaginasi').textContent = res.total + ' pesanan · halaman ' + res.hal + ' dari ' + res.totalHal;
        document.getElementById('btnHalPrev').disabled = (res.hal <= 1);
        document.getElementById('btnHalNext').disabled = (res.hal >= res.totalHal);

        res.items.forEach(function (p, i) {
            var tr = document.createElement('tr');

            var aksiHtml = '<div class="action-buttons">'
                + '<button type="button" class="btn-action btn-detail js-btn-detail" data-id="' + p.id + '">Detail</button>';

            if (p.status === 'Menunggu Konfirmasi') {
                aksiHtml += '<button type="button" class="btn-action btn-masak js-btn-masak" data-id="' + p.id + '" data-kode="' + p.kode + '">Mulai Masak</button>';
            } else if (p.status === 'Sedang Dimasak') {
                aksiHtml += '<button type="button" class="btn-action btn-siap js-btn-siap" data-id="' + p.id + '" data-kode="' + p.kode + '">Siap Diambil</button>';
            }
            aksiHtml += '</div>';

            tr.innerHTML = '<td>' + (res.offset + i + 1) + '</td>'
                + '<td><strong style="font-family:monospace;letter-spacing:0.5px;">' + p.kode + '</strong></td>'
                + '<td><strong>' + p.nama_pelanggan + '</strong></td>'
                + '<td>' + window.WARTEG_DB.tanggalId(p.tanggal_ambil, false) + '</td>'
                + '<td>' + window.WARTEG_DB.jamPendek(p.jam_ambil) + ' WIB</td>'
                + '<td><span class="badge ' + window.WARTEG_DB.kelasStatusBayar(p.status_bayar) + '">' + window.WARTEG_DB.statusBayarLabel(p.status_bayar) + '</span></td>'
                + '<td>' + window.WARTEG_DB.badgeStatus(p.status) + '</td>'
                + '<td class="kolom-aksi">' + aksiHtml + '</td>';

            tbody.appendChild(tr);
        });

        // Event Detail Modal
        document.querySelectorAll('.js-btn-detail').forEach(function (b) {
            b.onclick = function () {
                var pid = parseInt(this.getAttribute('data-id'), 10);
                var item = res.items.find(function (x) { return x.id === pid; });
                if (!item) return;

                var isi = document.getElementById('modalIsi');
                var cleanWa = (item.no_wa || '').replace(/\D/g, '');
                if (cleanWa.startsWith('0')) cleanWa = '62' + cleanWa.slice(1);
                var waLink = cleanWa ? 'https://wa.me/' + cleanWa : '';

                var h = '<div style="background:#f8fafc;border:1px solid var(--garis);border-radius:8px;padding:14px;margin-bottom:16px;">'
                    + '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:10px;font-size:13px;">'
                    + '<div><span class="teks-redup">Kode Pesanan:</span><br><strong style="font-family:monospace;font-size:14px;">' + item.kode + '</strong></div>'
                    + '<div><span class="teks-redup">Nama Pelanggan:</span><br><strong>' + item.nama_pelanggan + '</strong></div>'
                    + '<div><span class="teks-redup">WhatsApp:</span><br>' + (item.no_wa ? item.no_wa : '<span class="teks-redup">-</span>') + '</div>'
                    + '<div><span class="teks-redup">Jadwal Pengambilan:</span><br><strong>' + window.WARTEG_DB.tanggalId(item.tanggal_ambil) + '</strong> (' + window.WARTEG_DB.jamPendek(item.jam_ambil) + ' WIB)</div>'
                    + '<div><span class="teks-redup">Status Pesanan:</span><br>' + window.WARTEG_DB.badgeStatus(item.status) + '</div>'
                    + '<div><span class="teks-redup">Status Pembayaran:</span><br><span class="badge ' + window.WARTEG_DB.kelasStatusBayar(item.status_bayar) + '">' + window.WARTEG_DB.statusBayarLabel(item.status_bayar) + '</span></div>'
                    + '</div>'
                    + '</div>';

                // Rincian Menu Dipesan
                h += '<h3 style="font-size:14px;font-weight:700;margin:0 0 8px;color:var(--teks);">Rincian Pilihan Menu & Paket</h3>'
                    + '<table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:12px;">'
                    + '<thead><tr style="background:#f1f5f9;border-bottom:1px solid var(--garis);">'
                    + '<th style="text-align:left;padding:8px 10px;">Menu</th>'
                    + '<th style="text-align:center;padding:8px 10px;">Jumlah</th>'
                    + '<th style="text-align:right;padding:8px 10px;">Harga Satuan</th>'
                    + '<th style="text-align:right;padding:8px 10px;">Subtotal</th>'
                    + '</tr></thead><tbody>';

                (item.items || []).forEach(function (it) {
                    h += '<tr style="border-bottom:1px solid #f1f5f9;">'
                        + '<td style="padding:8px 10px;"><strong>' + it.nama + '</strong></td>'
                        + '<td style="text-align:center;padding:8px 10px;">' + it.jumlah + ' box</td>'
                        + '<td style="text-align:right;padding:8px 10px;color:var(--redup);">' + it.harga + '</td>'
                        + '<td style="text-align:right;padding:8px 10px;font-weight:600;">' + it.subtotal + '</td>'
                        + '</tr>';
                });

                h += '</tbody>'
                    + '<tfoot>'
                    + '<tr style="border-top:2px solid var(--garis);font-weight:700;background:#fff8ed;">'
                    + '<td style="padding:10px;" colspan="2">Total Box: ' + item.total_box + ' box</td>'
                    + '<td style="text-align:right;padding:10px;">Total Tagihan:</td>'
                    + '<td style="text-align:right;padding:10px;color:var(--oranye);font-size:15px;">' + window.WARTEG_DB.rupiah(item.total_harga) + '</td>'
                    + '</tr>'
                    + '</tfoot></table>';

                // Aksi Modal
                h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--garis);flex-wrap:wrap;">'
                    + '<div style="display:flex;gap:8px;flex-wrap:wrap;">';

                if (waLink) {
                    h += '<a href="' + waLink + '" target="_blank" rel="noopener" class="btn btn-secondary btn-kecil" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;">'
                        + '<svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.971.53 1.769.78 2.796.78 3.182 0 5.768-2.587 5.768-5.766.001-3.182-2.585-5.766-5.768-5.766zm9.969 5.766c0 5.488-4.48 9.969-9.969 9.969-1.748 0-3.377-.454-4.797-1.246l-5.234 1.339 1.378-5.074c-.902-1.488-1.416-3.23-1.416-5.088 0-5.488 4.48-9.969 9.969-9.969 5.489 0 9.969 4.481 9.969 9.969z"/></svg>'
                        + 'Chat WhatsApp</a>';
                }

                if (item.token_nota) {
                    h += '<a href="../nota.html?token=' + encodeURIComponent(item.token_nota) + '" target="_blank" class="btn btn-secondary btn-kecil" style="text-decoration:none;">Buka Nota Digital</a>';
                }

                h += '</div><div style="display:flex;gap:8px;flex-wrap:wrap;">';

                if (item.status === 'Menunggu Konfirmasi') {
                    h += '<button type="button" class="btn btn-primary btn-kecil js-modal-masak" data-id="' + item.id + '" data-kode="' + item.kode + '">Mulai Masak</button>';
                } else if (item.status === 'Sedang Dimasak') {
                    h += '<button type="button" class="btn btn-primary btn-kecil js-modal-siap" data-id="' + item.id + '" data-kode="' + item.kode + '">Siap Diambil</button>';
                }

                h += '<button type="button" class="btn btn-secondary btn-kecil js-modal-tutup-btn">Tutup</button>'
                    + '</div></div>';

                isi.innerHTML = h;

                // Bind Tombol Tutup di dalam modal
                isi.querySelector('.js-modal-tutup-btn').onclick = tutupModal;

                // Bind Tombol Ubah Status di dalam modal
                var bMasak = isi.querySelector('.js-modal-masak');
                if (bMasak) {
                    bMasak.onclick = async function () {
                        if (confirm('Mulai memasak pesanan ' + item.kode + '?')) {
                            await window.WARTEG_DB.ubahStatusKatering(item.id, 'Sedang Dimasak');
                            tutupModal();
                            muatDaftar();
                        }
                    };
                }
                var bSiap = isi.querySelector('.js-modal-siap');
                if (bSiap) {
                    bSiap.onclick = async function () {
                        if (confirm('Tandai pesanan ' + item.kode + ' sebagai Siap Diambil dan buka WhatsApp pelanggan?')) {
                            var h = await window.WARTEG_DB.ubahStatusKatering(item.id, 'Siap Diambil');
                            tutupModal();
                            if (h.wa_url) window.open(h.wa_url, '_blank');
                            muatDaftar();
                        }
                    };
                }

                var modal = document.getElementById('modalDetail');
                modal.style.display = 'flex';
                modal.hidden = false;
            };
        });

        // Event Mulai Masak di Baris Tabel
        document.querySelectorAll('.js-btn-masak').forEach(function (b) {
            b.onclick = async function () {
                var id = this.getAttribute('data-id');
                var kode = this.getAttribute('data-kode');
                if (confirm('Mulai memasak pesanan ' + kode + '?')) {
                    await window.WARTEG_DB.ubahStatusKatering(id, 'Sedang Dimasak');
                    muatDaftar();
                }
            };
        });

        // Event Siap Diambil di Baris Tabel
        document.querySelectorAll('.js-btn-siap').forEach(function (b) {
            b.onclick = async function () {
                var id = this.getAttribute('data-id');
                var kode = this.getAttribute('data-kode');
                if (confirm('Tandai pesanan ' + kode + ' sebagai Siap Diambil dan buka WhatsApp pelanggan?')) {
                    var h = await window.WARTEG_DB.ubahStatusKatering(id, 'Siap Diambil');
                    if (h.wa_url) window.open(h.wa_url, '_blank');
                    muatDaftar();
                }
            };
        });
    }

    function tutupModal() {
        var modal = document.getElementById('modalDetail');
        modal.style.display = 'none';
        modal.hidden = true;
    }

    document.getElementById('modalTutup').onclick = tutupModal;
    document.getElementById('modalDetail').onclick = function (e) {
        if (e.target === this) tutupModal();
    };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !document.getElementById('modalDetail').hidden) {
            tutupModal();
        }
    });

    document.getElementById('formFilter').onsubmit = function (e) {
        e.preventDefault();
        curHal = 1;
        muatDaftar();
    };

    document.getElementById('btnReset').onclick = function () {
        document.getElementById('filQ').value = '';
        document.getElementById('filTgl').value = '';
        document.getElementById('filStatus').value = '';
        curHal = 1;
        muatDaftar();
    };

    document.getElementById('btnHalPrev').onclick = function () {
        if (curHal > 1) { curHal--; muatDaftar(); }
    };
    document.getElementById('btnHalNext').onclick = function () {
        curHal++; muatDaftar();
    };

    muatDaftar();
});
</script>
</body>
</html>
