<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Menu Harian - Warteg Pak Sanam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/db-service.js"></script>
    <script defer src="../assets/js/admin-app.js"></script>
</head>
<body>
<div class="main-content">
    <div id="notifMenuHarian"></div>
    <div class="content-card">
        <div class="card-header filter-tanggal">
            <div>
                <h2 id="judulTanggal">Hari Ini</h2>
                <p class="teks-redup">Menu yang diaktifkan bisa dipilih untuk pesanan baru pada tanggal ini.</p>
            </div>
            <form class="form-tanggal" onsubmit="return false;">
                <button type="button" class="btn btn-secondary btn-kecil" id="tglPrev">Sebelumnya</button>
                <input class="form-control" type="date" id="inpTglMenu" aria-label="Pilih tanggal menu">
                <button type="button" class="btn btn-secondary btn-kecil" id="tglNext">Berikutnya</button>
            </form>
        </div>
        <div class="card-body">
            <div class="grid-menu" id="gridMenu">
                <p class="kosong">Memuat daftar menu...</p>
            </div>
            <p class="teks-redup" id="teksInfoKuota" style="margin-top:16px;">Kuota terpakai: 0 dari 120 box</p>
        </div>
    </div>
</div>

<!-- Modal Edit Menu -->
<div class="modal" id="modalEditMenu" hidden>
    <div class="modal-kotak" role="dialog" aria-modal="true" aria-labelledby="judulEditModal">
        <div class="modal-kepala">
            <h2 id="judulEditModal">Edit Menu</h2>
            <button type="button" class="btn-tutup" id="modalEditTutup" aria-label="Tutup jendela edit menu">&times;</button>
        </div>
        <div class="modal-isi">
            <form id="formEditMenu" class="form-menu" autocomplete="off">
                <input type="hidden" id="editMenuId">
                <label class="form-label" for="editNama">Nama menu</label>
                <input class="form-control" id="editNama" required>

                <div class="baris-dua" style="margin-top:10px;">
                    <div>
                        <label class="form-label" for="editKategori">Kategori</label>
                        <select class="form-select" id="editKategori" required>
                            <option value="nasi">Nasi</option>
                            <option value="lauk">Lauk</option>
                            <option value="sayur">Sayur</option>
                            <option value="paket a">Paket A</option>
                            <option value="paket b">Paket B</option>
                            <option value="paket c">Paket C</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="editHarga">Harga (Rp)</label>
                        <input class="form-control" type="number" id="editHarga" min="500" max="1000000" step="500" required>
                    </div>
                </div>

                <label class="form-label" for="editStok" style="margin-top:10px;">Stok untuk tanggal ini (box)</label>
                <input class="form-control" type="number" id="editStok" min="0" max="120" placeholder="Kosongkan untuk tanpa batas">

                <div class="aksi-modal" style="border-top:1px solid var(--garis);padding-top:14px;">
                    <button type="button" class="btn btn-hapus-menu" id="btnHapusMenu">Hapus menu</button>
                    <span class="aksi-modal-kanan">
                        <button type="button" class="btn btn-secondary" id="btnBatalEdit">Batal</button>
                        <button type="submit" class="btn btn-primary" id="btnSimpanEdit">Simpan Perubahan</button>
                    </span>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    var DB = window.WARTEG_DB;
    window.WARTEG_ADMIN_LAYOUT.render('menu', 'Menu Harian');

    var inpTgl = document.getElementById('inpTglMenu');
    var modalEdit = document.getElementById('modalEditMenu');
    var notifWrap = document.getElementById('notifMenuHarian');
    var curTgl = new Date().toISOString().slice(0, 10);
    inpTgl.value = curTgl;

    function tampilNotif(msg, tipe) {
        if (!notifWrap) return;
        notifWrap.innerHTML = '<div class="alert alert-' + (tipe || 'sukses') + '">' + DB.escapeHtml(msg) + '</div>';
        setTimeout(function () { notifWrap.innerHTML = ''; }, 4000);
    }

    function tutupModalEdit() {
        modalEdit.hidden = true;
    }

    async function muatMenuHarian() {
        var grid = document.getElementById('gridMenu');
        document.getElementById('judulTanggal').textContent = DB.tanggalId(curTgl);

        try {
            var kap = await DB.getKapasitasTanggal(curTgl);
            document.getElementById('teksInfoKuota').textContent = 'Kuota ' + DB.tanggalId(curTgl, false) + ': ' + kap.box + ' dari ' + kap.kapasitas + ' box terpakai, sisa ' + kap.sisa + ' box.';

            var menus = await DB.getMenuTanggal(curTgl);
            grid.innerHTML = '';

            if (!menus || !menus.length) {
                grid.innerHTML = '<p class="kosong">Belum ada data menu. Silakan klik <a href="tambah_menu.html" style="text-decoration:underline;color:var(--oranye);">Tambah Menu</a>.</p>';
                return;
            }

            menus.forEach(function (m) {
                var on = !!m.tersedia;
                var sisa = m.stok === null ? null : Math.max(0, m.stok - (m.jumlah || 0));
                var card = document.createElement('div');
                card.className = 'kartu-menu' + (on ? ' aktif' : '');
                card.dataset.menuId = m.id;

                var safeNama = DB.escapeHtml(m.nama);
                var imgThumb = m.foto
                    ? ('<img src="../uploads/menu/' + DB.escapeHtml(m.foto) + '" alt="' + safeNama + '" onerror="this.parentNode.innerHTML=\'<span aria-hidden=&quot;true&quot;>PS</span>\'">')
                    : '<span aria-hidden="true">PS</span>';

                card.innerHTML = '<div class="foto-menu">' + imgThumb + '</div>'
                    + '<div class="info-menu">'
                    + '<h3>' + safeNama + '</h3>'
                    + '<p class="teks-redup">' + DB.escapeHtml(m.kategori) + ' · ' + DB.rupiah(m.harga) + ' / box</p>'
                    + '<p class="status-menu">' + (on ? 'Tersedia untuk dipesan' : 'Tidak tersedia') + '</p>'
                    + '<p class="status-stok">' + (m.stok === null ? 'Stok: tanpa batas' : ('Stok: sisa ' + sisa + ' dari ' + m.stok + ' box')) + '</p>'
                    + '<p class="teks-redup">' + (m.jumlah || 0) + ' box sudah dipesan</p>'
                    + '</div>'
                    + '<div class="aksi-kartu">'
                    + '<label class="toggle" title="Aktif atau nonaktifkan menu" aria-label="Status ketersediaan ' + safeNama + '">'
                    + '<input type="checkbox" class="js-toggle" ' + (on ? 'checked' : '') + ' data-id="' + m.id + '">'
                    + '<span class="toggle-slider"></span>'
                    + '</label>'
                    + '<button type="button" class="btn-action btn-detail js-edit" data-item=\'' + JSON.stringify(m).replace(/'/g, "&apos;") + '\'>Edit</button>'
                    + '</div>';

                grid.appendChild(card);
            });

            document.querySelectorAll('.js-toggle').forEach(function (chk) {
                chk.onchange = async function () {
                    var mid = this.getAttribute('data-id');
                    var aktif = this.checked;
                    try {
                        await DB.toggleMenuHarian(mid, curTgl, aktif);
                        muatMenuHarian();
                    } catch (err) {
                        tampilNotif('Gagal memperbarui status ketersediaan menu.', 'galat');
                        this.checked = !aktif;
                    }
                };
            });

            document.querySelectorAll('.js-edit').forEach(function (btn) {
                btn.onclick = function () {
                    var m = JSON.parse(this.getAttribute('data-item'));
                    document.getElementById('editMenuId').value = m.id;
                    document.getElementById('editNama').value = m.nama;
                    document.getElementById('editKategori').value = m.kategori;
                    document.getElementById('editHarga').value = m.harga;
                    document.getElementById('editStok').value = m.stok === null ? '' : m.stok;

                    modalEdit.hidden = false;
                    document.getElementById('editNama').focus();
                };
            });
        } catch (err) {
            grid.innerHTML = '<div class="alert alert-galat">Gagal memuat daftar menu harian. Silakan muat ulang halaman.</div>';
        }
    }

    document.getElementById('modalEditTutup').onclick = tutupModalEdit;
    document.getElementById('btnBatalEdit').onclick = tutupModalEdit;
    modalEdit.onclick = function (e) {
        if (e.target === modalEdit) tutupModalEdit();
    };
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modalEdit.hidden) tutupModalEdit();
    });

    document.getElementById('formEditMenu').onsubmit = async function (e) {
        e.preventDefault();
        var btnSave = document.getElementById('btnSimpanEdit');
        btnSave.disabled = true;
        btnSave.textContent = 'Menyimpan...';

        try {
            await DB.simpanMenu({
                id: document.getElementById('editMenuId').value,
                nama: document.getElementById('editNama').value,
                kategori: document.getElementById('editKategori').value,
                harga: document.getElementById('editHarga').value,
                stok: document.getElementById('editStok').value,
                tanggal: curTgl
            });
            tutupModalEdit();
            tampilNotif('Perubahan menu berhasil disimpan.', 'sukses');
            muatMenuHarian();
        } catch (err) {
            tampilNotif('Gagal menyimpan perubahan menu.', 'galat');
        } finally {
            btnSave.disabled = false;
            btnSave.textContent = 'Simpan Perubahan';
        }
    };

    document.getElementById('btnHapusMenu').onclick = async function () {
        var mid = document.getElementById('editMenuId').value;
        if (confirm('Hapus menu ini dari master? Pesanan lama tidak akan berubah.')) {
            try {
                await DB.hapusMenu(mid);
                tutupModalEdit();
                tampilNotif('Menu berhasil dihapus.', 'sukses');
                muatMenuHarian();
            } catch (err) {
                tampilNotif('Gagal menghapus menu.', 'galat');
            }
        }
    };

    inpTgl.onchange = function () { curTgl = this.value; muatMenuHarian(); };
    document.getElementById('tglPrev').onclick = function () {
        var d = new Date(curTgl);
        d.setDate(d.getDate() - 1);
        curTgl = d.toISOString().slice(0, 10);
        inpTgl.value = curTgl;
        muatMenuHarian();
    };
    document.getElementById('tglNext').onclick = function () {
        var d = new Date(curTgl);
        d.setDate(d.getDate() + 1);
        curTgl = d.toISOString().slice(0, 10);
        inpTgl.value = curTgl;
        muatMenuHarian();
    };

    muatMenuHarian();
});
</script>
</body>
</html>
