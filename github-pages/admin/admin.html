<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manajemen Admin - Warteg Pak Sanam</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/db-service.js"></script>
    <script src="../assets/js/admin-app.js"></script>
</head>
<body>
<div class="main-content">
    <div id="notifWrapAdmin" style="margin-bottom:14px;"></div>

    <section class="grid-dua">
        <div class="content-card">
            <div class="card-header">
                <h2>Tambah Admin Baru</h2>
                <span class="teks-redup">Khusus Owner</span>
            </div>
            <div class="card-body">
                <form id="formTambahAdmin" autocomplete="off">
                    <label class="form-label" for="admNama">Nama lengkap <span class="wajib">*</span></label>
                    <input class="form-control" id="admNama" required maxlength="100" placeholder="Contoh: Siti Aminah"
                           pattern="[^\d]*" title="Nama hanya boleh huruf, spasi, titik, apostrof, dan tanda hubung (tanpa angka)">
                    <p class="bantuan" id="namaAdminGalat" style="color:var(--merah);display:none;margin-top:4px;font-size:12px;"></p>

                    <label class="form-label" for="admUsername">Username <span class="wajib">*</span></label>
                    <input class="form-control" id="admUsername" required maxlength="50" placeholder="username_staf"
                           pattern="[A-Za-z0-9._\-]{3,50}" title="3-50 karakter: huruf, angka, titik, garis bawah, garis hubung">

                    <label class="form-label" for="admEmail">Email (opsional)</label>
                    <input class="form-control" id="admEmail" type="email" placeholder="staf@warteg.test">

                    <label class="form-label" for="admTelepon">Nomor Telepon / WA (opsional)</label>
                    <input class="form-control" id="admTelepon" placeholder="08xxxxxxxxxx">

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                        <div>
                            <label class="form-label" for="admPassword">Password <span class="wajib">*</span></label>
                            <input class="form-control" id="admPassword" type="password" required minlength="6">
                        </div>
                        <div>
                            <label class="form-label" for="admKonfirmasi">Konfirmasi Password <span class="wajib">*</span></label>
                            <input class="form-control" id="admKonfirmasi" type="password" required minlength="6">
                        </div>
                    </div>

                    <label class="form-label" for="admRole" style="margin-top:10px;">Peran (Role) <span class="wajib">*</span></label>
                    <select class="form-select" id="admRole" required>
                        <option value="admin">Admin (Kelola menu & pesanan)</option>
                        <option value="owner">Owner (Akses penuh + QRIS & Admin)</option>
                    </select>

                    <button class="btn btn-primary btn-blok" type="submit" id="btnSubmitAdmin" style="margin-top:16px;">Tambah Admin</button>
                </form>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h2>Daftar Akun Admin</h2>
                <span class="teks-redup">Total akun terdaftar</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Nama</th><th>Username</th><th>Peran</th><th>Kontak</th><th class="kolom-aksi">Aksi</th></tr>
                    </thead>
                    <tbody id="tbodyAdmin">
                        <tr><td colspan="5" class="kosong">Memuat akun admin...</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="teks-redup" style="padding:12px 16px 16px;font-size:12.5px;">Hanya akun ber-peran Admin yang dapat dihapus. Akun Owner dan akun Anda sendiri dilindungi dan tidak dapat dihapus dari halaman ini.</p>
        </div>
    </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    window.WARTEG_ADMIN_LAYOUT.render('admin', 'Manajemen Admin');

    function notif(msg, tipe) {
        var w = document.getElementById('notifWrapAdmin');
        w.innerHTML = '<div class="alert alert-' + (tipe || 'sukses') + '">' + msg + '</div>';
        setTimeout(function () { w.innerHTML = ''; }, 4500);
    }

    var namaInput = document.getElementById('admNama'), namaGalat = document.getElementById('namaAdminGalat');
    function cekNama(nilai) {
        var v = (nilai || '').trim();
        if (v === '') return 'Nama lengkap wajib diisi.';
        if (v.length > 100) return 'Nama lengkap maksimal 100 karakter.';
        if (/[0-9]/.test(v)) return 'Nama lengkap tidak boleh mengandung angka.';
        if (!/^[A-Za-z\u00C0-\u024F\u1E00-\u1EFF ]+$/.test(v.replace(/[.'’\-]/g, ' '))) return 'Nama lengkap hanya boleh berisi huruf, spasi, titik, apostrof, dan tanda hubung.';
        return '';
    }

    if (namaInput && namaGalat) {
        var tampilGalatNama = function () {
            var g = cekNama(namaInput.value);
            namaGalat.textContent = g;
            namaGalat.style.display = g ? 'block' : 'none';
            namaInput.setCustomValidity(g);
        };
        namaInput.addEventListener('input', tampilGalatNama);
        namaInput.addEventListener('blur', tampilGalatNama);
    }

    async function muatAdminList() {
        var tbody = document.getElementById('tbodyAdmin');
        try {
            var list = await window.WARTEG_DB.getDaftarAdmin();
            var sesi = (window.WARTEG_DB.getAdminSesi ? window.WARTEG_DB.getAdminSesi() : (window.WARTEG_DB.getSesiAdmin ? window.WARTEG_DB.getSesiAdmin() : {})) || {};

            tbody.innerHTML = '';
            if (!list || !list.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="kosong">Belum ada akun admin terdaftar.</td></tr>';
                return;
            }

            list.forEach(function (adm) {
                var saya = (sesi.id && parseInt(sesi.id, 10) === parseInt(adm.id, 10)) || (sesi.username === adm.username);
                var isOwner = (adm.role === 'owner');
                var inisial = (adm.nama || adm.username || 'A').charAt(0).toUpperCase();

                var aksiHtml = '';
                if (!saya && !isOwner) {
                    aksiHtml = '<button type="button" class="btn btn-kecil btn-hapus-admin" data-id="' + adm.id + '" data-nama="' + (adm.nama || '') + '" data-username="' + adm.username + '">Hapus</button>';
                } else if (saya) {
                    aksiHtml = '<span class="tag-saya">Sesi Anda</span>';
                } else {
                    aksiHtml = '<span class="teks-redup">-</span>';
                }

                var kontak = [];
                if (adm.telepon) kontak.push('WA: ' + adm.telepon);
                if (adm.email) kontak.push(adm.email);
                var kontakTeks = kontak.length ? kontak.join('<br>') : '<span class="teks-redup">-</span>';

                var fotoHtml = '';
                if (adm.foto) {
                    fotoHtml = '<img src="../uploads/admin/' + adm.foto + '" alt="' + adm.nama + '" class="avatar" style="width:34px;height:34px;object-fit:cover;border-radius:8px;" onerror="this.outerHTML=\'<span class=\\\'avatar avatar-inisial\\\' style=\\\'width:34px;height:34px;font-size:13px;\\\'>' + inisial + '</span>\'">';
                } else {
                    fotoHtml = '<span class="avatar avatar-inisial" style="width:34px;height:34px;font-size:13px;">' + inisial + '</span>';
                }

                var tr = document.createElement('tr');
                tr.innerHTML = '<td><div class="sel-admin" style="display:flex;align-items:center;gap:10px;">'
                    + fotoHtml
                    + '<div><strong>' + adm.nama + '</strong>' + (saya ? ' <span class="badge-saya">Anda</span>' : '') + '</div>'
                    + '</div></td>'
                    + '<td><code style="font-size:12.5px;">' + adm.username + '</code></td>'
                    + '<td><span class="role-badge' + (isOwner ? ' owner' : '') + '">' + (adm.role || 'admin').toUpperCase() + '</span></td>'
                    + '<td style="font-size:12px;line-height:1.4;">' + kontakTeks + '</td>'
                    + '<td class="kolom-aksi">' + aksiHtml + '</td>';
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error('Gagal memuat admin list:', err);
            tbody.innerHTML = '<tr><td colspan="5" class="kosong" style="color:var(--merah);">Gagal memuat akun admin: ' + (err.message || 'Terjadi kesalahan.') + '</td></tr>';
        }
    }

    // Event Hapus Admin
    document.addEventListener('click', async function (ev) {
        var b = ev.target.closest('.btn-hapus-admin');
        if (!b) return;
        var id = b.dataset.id, nm = b.dataset.nama || '', un = b.dataset.username || '';
        var label = un ? (nm ? nm + ' (' + un + ')' : un) : ('#' + id);

        if (!window.confirm('Hapus akun admin "' + label + '"?\n\nTindakan ini tidak dapat dibatalkan.')) return;
        b.disabled = true;

        var sesi = (window.WARTEG_DB.getAdminSesi ? window.WARTEG_DB.getAdminSesi() : (window.WARTEG_DB.getSesiAdmin ? window.WARTEG_DB.getSesiAdmin() : {})) || {};
        var res = await window.WARTEG_DB.hapusAdmin(id, sesi.id);

        if (!res || !res.ok) {
            b.disabled = false;
            alert((res && res.pesan) || 'Gagal menghapus akun admin.');
            return;
        }

        notif(res.pesan || 'Akun admin berhasil dihapus.', 'sukses');
        muatAdminList();
    });

    document.getElementById('formTambahAdmin').onsubmit = async function (e) {
        e.preventDefault();
        var nama = document.getElementById('admNama').value.trim();
        var username = document.getElementById('admUsername').value.trim();
        var email = document.getElementById('admEmail').value.trim();
        var telepon = document.getElementById('admTelepon').value.trim();
        var pass = document.getElementById('admPassword').value;
        var konf = document.getElementById('admKonfirmasi').value;
        var role = document.getElementById('admRole').value;

        var errNama = cekNama(nama);
        if (errNama) {
            alert(errNama);
            document.getElementById('admNama').focus();
            return;
        }

        if (pass !== konf) {
            alert('Konfirmasi password tidak cocok.');
            return;
        }

        var btn = document.getElementById('btnSubmitAdmin');
        btn.disabled = true;
        btn.textContent = 'Menambahkan...';

        var res = await window.WARTEG_DB.tambahAdmin({
            nama: nama,
            username: username,
            password_hash: pass,
            email: email,
            telepon: telepon,
            role: role
        });

        btn.disabled = false;
        btn.textContent = 'Tambah Admin';

        if (!res || !res.ok) {
            alert((res && res.pesan) || 'Gagal menambahkan admin.');
            return;
        }

        notif('Admin "' + username + '" berhasil ditambahkan!', 'sukses');
        document.getElementById('formTambahAdmin').reset();
        muatAdminList();
    };

    muatAdminList();
});
</script>
</body>
</html>
