<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Rekap Harian - Warteg Pak Sanam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../assets/js/config.js"></script>
    <script defer src="../assets/js/db-service.js"></script>
    <script defer src="../assets/js/admin-app.js"></script>
</head>
<body>
<div class="main-content">
    <section class="grid-kalender" id="rekapApp">
        <!-- Kalender Rekap Bulanan -->
        <div class="content-card">
            <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="btn btn-secondary btn-kecil" id="bulanSebelum" aria-label="Bulan Sebelumnya">Sebelumnya</button>
                    <button type="button" class="btn btn-secondary btn-kecil" id="btnHariIni">Hari Ini</button>
                    <button type="button" class="btn btn-secondary btn-kecil" id="bulanBerikut" aria-label="Bulan Berikutnya">Berikutnya</button>
                </div>
                <h2 id="judulBulan" style="margin:0;font-size:16px;font-weight:800;">November 2026</h2>
            </div>
            <div class="card-body">
                <div class="kalender-nama-hari">
                    <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
                </div>
                <div class="kalender-grid" id="kalender"></div>
                <p class="teks-redup legenda" style="margin-top:14px;line-height:1.5;">
                    Keterangan: Kotak berlatar oranye menandakan terdapat pesanan katering masuk. Batas kapasitas dapur adalah 120 box per hari.
                </p>
            </div>
        </div>

        <!-- Detail Pesanan Tanggal Terpilih -->
        <div class="content-card">
            <div class="card-header">
                <h2 id="judulRekap" style="margin:0;font-size:16px;">Rekap Tanggal</h2>
            </div>
            <div class="card-body" id="isiRekap">
                <p class="kosong">Pilih tanggal pada kalender untuk melihat rincian.</p>
            </div>
        </div>
    </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    var DB = window.WARTEG_DB;
    window.WARTEG_ADMIN_LAYOUT.render('rekap', 'Rekap Harian');

    var skrg = new Date();
    var curThn = skrg.getFullYear();
    var curBln = skrg.getMonth() + 1;
    var tglTerpilih = skrg.toISOString().slice(0, 10);
    var hariIniStr = tglTerpilih;

    var namaBulan = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    async function renderKalender() {
        document.getElementById('judulBulan').textContent = namaBulan[curBln] + ' ' + curThn;
        var kal = document.getElementById('kalender');

        try {
            var dataBulan = await DB.getRekapBulan(curThn, curBln);

            var firstDay = new Date(curThn, curBln - 1, 1).getDay();
            var startDay = (firstDay === 0 ? 7 : firstDay) - 1;
            var totalHari = new Date(curThn, curBln, 0).getDate();

            kal.innerHTML = '';

            for (var i = 0; i < startDay; i++) {
                var kosong = document.createElement('div');
                kosong.className = 'sel-hari sel-kosong';
                kosong.setAttribute('aria-hidden', 'true');
                kal.appendChild(kosong);
            }

            for (var d = 1; d <= totalHari; d++) {
                var strTgl = curThn + '-' + String(curBln).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                var info = dataBulan[strTgl] || { box: 0, pesanan: 0 };
                var sisa = Math.max(0, 120 - info.box);

                var kelas = 'sel-hari'
                    + (info.box > 0 ? (sisa === 0 ? ' penuh' : ' ada') : '')
                    + (strTgl === hariIniStr ? ' hari-ini' : '')
                    + (strTgl === tglTerpilih ? ' dipilih' : '');

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = kelas;
                btn.dataset.tgl = strTgl;
                btn.setAttribute('aria-pressed', strTgl === tglTerpilih ? 'true' : 'false');
                btn.setAttribute('aria-label', d + ' ' + namaBulan[curBln] + (info.box > 0 ? ', ' + info.box + ' box, ' + info.pesanan + ' pesanan' : ', sisa 120 box'));

                var innerHtml = '<span class="angka">' + d + '</span>';
                if (info.box > 0) {
                    innerHtml += '<span class="kecil">' + info.pesanan + ' pesanan</span>'
                        + '<span style="font-weight:700;font-size:11px;">' + info.box + ' box</span>'
                        + '<span class="kecil">sisa ' + sisa + '</span>';
                } else {
                    innerHtml += '<span class="kecil">sisa 120</span>';
                }
                btn.innerHTML = innerHtml;

                btn.onclick = function () {
                    tglTerpilih = this.dataset.tgl;
                    document.querySelectorAll('button.sel-hari').forEach(function (x) {
                        x.classList.remove('dipilih');
                        x.setAttribute('aria-pressed', 'false');
                    });
                    this.classList.add('dipilih');
                    this.setAttribute('aria-pressed', 'true');
                    muatRekapTanggal(tglTerpilih);
                };

                kal.appendChild(btn);
            }
        } catch (err) {
            kal.innerHTML = '<div class="alert alert-galat" style="grid-column:1 / -1;">Gagal memuat kalender rekap bulan ini.</div>';
        }
    }

    async function muatRekapTanggal(tgl) {
        var judulEl = document.getElementById('judulRekap');
        var isi = document.getElementById('isiRekap');
        if (judulEl) judulEl.textContent = 'Rekap: ' + DB.tanggalId(tgl);
        isi.innerHTML = '<div class="kosong"><div class="spinner" style="margin:0 auto 10px;"></div><p>Memuat rekap data...</p></div>';

        try {
            var kap = await DB.getKapasitasTanggal(tgl);
            var res = await DB.getDaftarPemesan({ tanggal: tgl, per: 100 });
            var items = res.items || [];

            var menuAgg = {};
            items.forEach(function (p) {
                (p.items || []).forEach(function (it) {
                    menuAgg[it.nama] = (menuAgg[it.nama] || 0) + (it.jumlah || 0);
                });
            });

            var persenPakai = kap.kapasitas > 0 ? Math.min(100, Math.round((kap.box / kap.kapasitas) * 100)) : 0;
            var levelClass = kap.level === 'penuh' ? 'level-penuh' : (kap.level === 'hampir' ? 'level-hampir' : 'level-aman');

            var html = '<div style="margin-bottom:16px;">'
                + '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;">'
                + '<span style="font-weight:700;font-size:13.5px;">Kapasitas Dapur</span>'
                + '<strong style="font-size:14px;color:var(--teks);">' + kap.box + ' dari ' + kap.kapasitas + ' Box</strong>'
                + '</div>'
                + '<div class="progress" style="margin:6px 0 8px;">'
                + '<div class="progress-bar ' + levelClass + '" style="width:' + persenPakai + '%;"></div>'
                + '</div>'
                + '<p class="teks-redup" style="font-size:12px;margin:0;">'
                + 'Sisa kuota: <strong>' + kap.sisa + ' box</strong>' + (kap.sisa === 0 ? ' (Penuh)' : '') + ' · ' + items.length + ' transaksi pesanan'
                + '</p>'
                + '</div>';

            if (!items.length) {
                html += '<div class="kosong" style="padding:32px 16px;border-top:1px dashed var(--garis);">'
                    + '<p><strong>Tidak Ada Pesanan</strong><br>'
                    + '<span class="teks-redup" style="font-size:12.5px;">Belum ada pesanan katering untuk tanggal ini. Kuota dapur 120 box masih tersedia penuh.</span></p>'
                    + '</div>';
            } else {
                html += '<div style="border-top:1px dashed var(--garis);padding-top:14px;margin-top:14px;">'
                    + '<h3 style="font-size:13.5px;font-weight:800;color:var(--teks);margin-bottom:8px;">Ringkasan Menu Dipesan</h3>'
                    + '<ul class="rekap-menu">';

                var menuKeys = Object.keys(menuAgg);
                if (menuKeys.length > 0) {
                    menuKeys.forEach(function (mName) {
                        html += '<li><span>' + DB.escapeHtml(mName) + '</span><strong>' + menuAgg[mName] + ' item</strong></li>';
                    });
                }
                html += '<li class="total"><span>Total Box Utama Terjadwal</span><strong>' + kap.box + ' box</strong></li>';
                html += '</ul></div>';

                html += '<div style="border-top:1px dashed var(--garis);padding-top:14px;margin-top:14px;">'
                    + '<h3 style="font-size:13.5px;font-weight:800;color:var(--teks);margin-bottom:10px;">Daftar Pesanan (' + items.length + ')</h3>'
                    + '<div class="rekap-pemesan">';

                items.forEach(function (p) {
                    var waUrlRekap = DB.urlWaPelangganStatus(p, p.items || [], 'info');
                    var nominalBersih = p.nominal_bayar || p.total_harga;

                    html += '<div class="item-pemesan">'
                        + '<div class="baris">'
                        + '<div><strong style="font-size:14px;">' + DB.escapeHtml(p.nama_pelanggan) + '</strong> <span style="font-size:12px;color:var(--redup);">(' + DB.escapeHtml(p.kode) + ')</span></div>'
                        + DB.badgeStatus(p.status)
                        + '</div>'
                        + '<div class="teks-redup" style="font-size:12px;margin:3px 0 6px;">'
                        + 'Jam Ambil: <b>' + DB.jamPendek(p.jam_ambil) + ' WIB</b> · '
                        + 'Total: <b>' + Number(p.total_box || 0) + ' box</b> (' + DB.rupiah(nominalBersih) + (p.diskon > 0 ? ' · hemat ' + DB.rupiah(p.diskon) : '') + ')'
                        + '</div>';

                    if (p.ringkas) {
                        html += '<div style="font-size:12px;color:var(--teks);background:#f5f3ef;padding:6px 10px;border-radius:6px;border:1px solid var(--garis);margin-bottom:8px;">'
                            + 'Menu: ' + DB.escapeHtml(p.ringkas)
                            + '</div>';
                    }

                    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
                        + '<a href="pemesan.html?q=' + encodeURIComponent(p.kode) + '" class="btn-action btn-detail">Buka Detail Pesanan</a>';
                    if (waUrlRekap) {
                        html += '<a href="' + DB.escapeHtml(waUrlRekap) + '" target="_blank" rel="noopener" class="btn-action btn-wa">Chat WA Pelanggan</a>';
                    }
                    html += '</div></div>';
                });

                html += '</div></div>';
            }

            isi.innerHTML = html;
        } catch (err) {
            isi.innerHTML = '<div class="alert alert-galat">Gagal memuat rincian rekap: ' + DB.escapeHtml(err.message || 'Terjadi kesalahan') + '</div>';
        }
    }

    document.getElementById('bulanSebelum').onclick = function () {
        curBln--;
        if (curBln < 1) { curBln = 12; curThn--; }
        renderKalender();
    };
    document.getElementById('bulanBerikut').onclick = function () {
        curBln++;
        if (curBln > 12) { curBln = 1; curThn++; }
        renderKalender();
    };
    document.getElementById('btnHariIni').onclick = function () {
        var dNow = new Date();
        curThn = dNow.getFullYear();
        curBln = dNow.getMonth() + 1;
        tglTerpilih = hariIniStr;
        renderKalender();
        muatRekapTanggal(tglTerpilih);
    };

    renderKalender();
    muatRekapTanggal(tglTerpilih);
});
</script>
</body>
</html>
